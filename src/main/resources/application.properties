spring.application.name=smartshop-backend
server.port=8080

# Database Configuration (MySQL)
# Set DB_USERNAME and DB_PASSWORD as environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# Set APP_JWT_SECRET as an environment variable (min 64 hex chars)
app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_USE_A_STRONG_64_CHAR_HEX_SECRET_IN_PRODUCTION}
app.jwt.expiration-ms=86400000